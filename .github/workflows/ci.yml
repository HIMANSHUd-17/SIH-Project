name: SafeYatra CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy through AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0a7fc488aae164474 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo -u ubuntu -H bash /home/ubuntu/deploy-safeyatra.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0a7fc488aae164474

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0a7fc488aae164474 \
            --query "StandardOutputContent" \
            --output text